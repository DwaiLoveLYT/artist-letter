<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>接单台账 · 内部</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ==================== 锁屏（内容由 renderLock 按步骤渲染） ==================== -->
<div class="lock" id="lock">
  <div class="lock-inner" id="lock-inner"></div>
</div>

<!-- ==================== 主体 ==================== -->
<div class="app" id="app" style="display:none;">

  <header class="topbar">
    <div class="brand">接单台账</div>
    <button class="icon-btn" onclick="openSettings()" aria-label="设置">⚙</button>
  </header>

  <div class="wrap">

    <!-- 待办看板 -->
    <div class="board" id="board"></div>

    <!-- 新建订单 -->
    <button class="btn-full" style="margin-bottom:12px;" onclick="openNewOrder()">＋ 新建订单（粘贴客户信息）</button>

    <!-- 收款台 -->
    <div class="card card-accent">
      <div class="card-head"><span class="pulse"></span>收款台</div>

      <!-- 本机台账状态：一眼看出这台设备上有没有数据 -->
      <div class="local-strip" id="local-strip"></div>

      <button class="btn-full" onclick="openReconPaste()">📋 粘贴对账 · 一次认一批</button>
      <div class="hint" style="margin:9px 0 0;">客户发来的消息、或微信账单里的文字，整段粘进来，我自动把里面的订单号挑出来</div>

      <div class="recon-or"><span>或 直接输尾号</span></div>

      <div class="recon-row">
        <input class="input" id="recon" maxlength="4" inputmode="text" placeholder="订单号后 4 位" autocomplete="off">
        <button class="btn-sm" onclick="doReconcile()">查找</button>
      </div>
      <div class="hint">只对「已录进台账」的订单有效。没录过的单，先用上面的「新建订单」粘进来。</div>
      <div id="recon-result"></div>
    </div>

    <!-- 工具 -->
    <div class="tools">
      <button class="tool" onclick="doExport()"><span>📤</span>导出备份</button>
      <button class="tool" onclick="pickImport()"><span>📥</span>导入备份</button>
      <button class="tool" onclick="copyUnpaid()"><span>📋</span>待收款清单</button>
    </div>

    <!-- 筛选 -->
    <div class="chips" id="chips"></div>
    <input class="input" id="kw" placeholder="搜订单号后 4 位 / 艺人 / 手机号" oninput="renderList()" autocomplete="off">

    <div id="list"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">没有匹配的订单</div>
      <div class="empty-sub">换个筛选条件，或清空搜索词</div>
    </div>

    <div class="footer-note">数据只存在这台设备的浏览器里 · 换手机请先导出备份</div>
  </div>
</div>

<!-- ==================== 底部弹层 ==================== -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheet-inner"></div></div>
<div id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
